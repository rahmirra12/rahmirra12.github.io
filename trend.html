<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Trends 图表切换</title>
    <!-- 引入 Google Trends Embed 脚本 -->
    <script type="text/javascript" src="https://ssl.gstatic.com/trends_nrtr/3882_RC01/embed_loader.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f9f9f9;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* 按钮样式 */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #e8f0fe;
            color: #1a73e8;
            border: 1px solid #d2e3fc;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #d2e3fc;
        }

        .btn.active {
            background-color: #1a73e8;
            color: #ffffff;
            border-color: #1a73e8;
        }

        /* 图表容器样式 */
        .chart-wrapper {
            position: relative;
            min-height: 450px;
            border: 1px solid #eee;
            border-radius: 6px;
            padding: 10px;
        }

        .chart-panel {
    display: none; 
    width: 100%;
    height: 480px; /* 必须给移动端一个绝对高度，不能只用 100% */
}

        .chart-panel.active {
            display: block; /* 显示当前激活的面板 */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>谷歌趋势 (Google Trends) 动态切换</h1>

    <div class="button-group">
        <button class="btn active" onclick="switchTimeTab('t1', 'now 1-H', this)">过去 1 小时</button>
        <button class="btn" onclick="switchTimeTab('t2', 'now 4-H', this)">过去 4 小时</button>
        <button class="btn" onclick="switchTimeTab('t3', 'now 1-d', this)">过去 1 天</button>
        <button class="btn" onclick="switchTimeTab('t4', 'now 7-d', this)">过去 7 天</button>
        <button class="btn" onclick="switchTimeTab('t5', 'today 1-m', this)">过去 30 天</button>
        <button class="btn" onclick="switchTimeTab('t6', 'today 3-m', this)">过去 90 天</button>
        <button class="btn" onclick="switchTimeTab('t7', 'today 12-m', this)">过去 12 个月</button>
        <button class="btn" onclick="switchTimeTab('t8', 'today 5-y', this)">过去 5 年</button>
        <button class="btn" onclick="switchTimeTab('t9', 'all', this)">2004 年至今</button>
    </div>

    <!-- 动态面板容器 -->
    <div class="chart-wrapper" id="chart-wrapper">
        <!-- 面板通过 JS 动态创建或直接声明 -->
        <div id="t1" class="chart-panel active"><div id="embed-t1" style="width:100%;height:100%;"></div></div>
        <div id="t2" class="chart-panel"><div id="embed-t2" style="width:100%;height:100%;"></div></div>
        <div id="t3" class="chart-panel"><div id="embed-t3" style="width:100%;height:100%;"></div></div>
        <div id="t4" class="chart-panel"><div id="embed-t4" style="width:100%;height:100%;"></div></div>
        <div id="t5" class="chart-panel"><div id="embed-t5" style="width:100%;height:100%;"></div></div>
        <div id="t6" class="chart-panel"><div id="embed-t6" style="width:100%;height:100%;"></div></div>
        <div id="t7" class="chart-panel"><div id="embed-t7" style="width:100%;height:100%;"></div></div>
        <div id="t8" class="chart-panel"><div id="embed-t8" style="width:100%;height:100%;"></div></div>
        <div id="t9" class="chart-panel"><div id="embed-t9" style="width:100%;height:100%;"></div></div>
    </div>
    </div>

<script type="text/javascript">
    // 1. 设置想要查询的关键词
    const keyword = "AI";

    // 2. 缓存已被渲染的选项，防止重复请求
    const loadedTabs = {};

    /**
     * 渲染趋势图表核心逻辑
     * @param {string} tabId - DOM 节点 ID
     * @param {string} timeParam - 谷歌官方 time 参数
     */
    function renderTrendsChart(tabId, timeParam) {
        if (loadedTabs[tabId]) return;

        const targetElem = document.getElementById(`embed-${tabId}`);

        trends.embed.renderExploreWidgetTo(
            targetElem,
            "TIMESERIES",
            {
                "comparisonItem": [
                    { "keyword": keyword, "geo": "", "time": timeParam }
                ],
                "category": 0,
                "property": ""
            },
            {
                "exploreQuery": `q=${encodeURIComponent(keyword)}&date=${encodeURIComponent(timeParam)}`,
                "guestPath": "https://trends.google.com:443/trends/embed/"
            }
        );

        loadedTabs[tabId] = true;
    }

    /**
     * Tab 切换控制逻辑
     */
    function switchTimeTab(tabId, timeParam, btnElement) {
        // 按钮高亮处理
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // 面板显隐切换
        const panels = document.querySelectorAll('.chart-panel');
        panels.forEach(panel => panel.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');

        // 懒加载该时间范围的图表
        renderTrendsChart(tabId, timeParam);
    }

    // 页面加载后默认渲染第一个（过去 1 小时）
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('kw-display').innerText = keyword;
        renderTrendsChart('t1', 'now 1-H');
    });
</script>
</body>
</html>
